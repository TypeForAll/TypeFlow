<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoBuddy</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
    text-align: center;
}

main { max-width: 650px; margin: auto; }

h1 { color: #8db5ff; font-size: 36px; }
h2 { font-size: 22px; }

.card {
    background: #1d2638;
    padding: 20px;
    border-radius: 16px;
    margin: 18px 0;
}

button, input {
    font: inherit;
    border-radius: 12px;
    padding: 14px;
}

button {
    border: 0;
    background: #8db5ff;
    color: #101522;
    font-weight: bold;
    cursor: pointer;
    min-height: 50px;
}

button:disabled { opacity: .65; }

.main-button {
    display: block;
    width: 100%;
    margin: 10px 0;
    font-size: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.grid button { width: 100%; }

input {
    width: 100%;
    border: 0;
    background: white;
    color: #111;
    margin: 8px 0;
}

#status {
    min-height: 24px;
    color: #d1e0ff;
}

#heard { overflow-wrap: anywhere; }

a { color: #8db5ff; }

@media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 12px; }
}
</style>
</head>

<body>
<main>
    <h1>🎬 VideoBuddy</h1>
    <p>Find videos you love!</p>

    <section class="card">
        <button class="main-button" id="talk">🎤 Talk</button>
        <button class="main-button" id="toggle">🔊 Speaking: ON</button>
        <button class="main-button" id="stop">⏹ Stop</button>
        <p id="status" aria-live="polite">Ready!</p>
        <p id="heard" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>🔎 Search Videos</h2>
        <form id="searchForm">
            <input id="searchInput"
                   placeholder="What do you want to watch?"
                   aria-label="What do you want to watch?"
                   autocomplete="off">
            <button class="main-button" type="submit">Search</button>
        </form>
    </section>

    <section class="card">
        <h2>🍜 Food &amp; Eating ASMR</h2>
        <div class="grid">
            <button data-query="eating ASMR">🍜 Eating ASMR</button>
            <button data-query="crunchy food ASMR">🥨 Crunchy Food</button>
            <button data-query="street food videos">🌮 Street Food</button>
            <button data-query="Indian food videos">🍛 Indian Food</button>
            <button data-query="dessert ASMR">🍰 Dessert ASMR</button>
            <button data-query="chocolate ASMR">🍫 Chocolate</button>
            <button data-query="cooking videos">🍳 Cooking</button>
            <button data-query="bakery tours">🥐 Bakeries</button>
            <button data-query="ice cream videos">🍦 Ice Cream</button>
            <button data-query="satisfying food videos">🥞 Satisfying Food</button>
        </div>
    </section>

    <section class="card">
        <h2>✈️ Travel &amp; Places</h2>
        <div class="grid">
            <button data-query="India travel videos">🇮🇳 India</button>
            <button data-query="Europe travel videos">🇪🇺 Europe</button>
            <button data-query="Bahamas vacation videos">🏝️ Bahamas</button>
            <button data-query="beach vacation videos">🏖️ Beaches</button>
            <button data-query="hotel room tours">🏨 Hotels</button>
            <button data-query="luxury hotel tours">🛎️ Luxury Hotels</button>
            <button data-query="airport tours">🛫 Airports</button>
            <button data-query="airplane cabin tours">💺 Airplane Cabins</button>
            <button data-query="airline seat reviews">🪑 Airline Seats</button>
            <button data-query="plane takeoff videos">🛩️ Plane Takeoffs</button>
            <button data-query="cruise ship tours">🛳️ Cruise Ships</button>
            <button data-query="scenic train journeys">🚆 Train Journeys</button>
            <button data-query="theme park tours">🎢 Theme Parks</button>
            <button data-query="aquarium tours">🐠 Aquariums</button>
        </div>
    </section>

    <section class="card">
        <h2>🐾 Animals &amp; Nature</h2>
        <div class="grid">
            <button data-query="funny dog videos">🐶 Dogs</button>
            <button data-query="funny cat videos">🐱 Cats</button>
            <button data-query="baby animal videos">🐣 Baby Animals</button>
            <button data-query="ocean animal videos">🐬 Ocean Animals</button>
            <button data-query="wildlife documentaries">🦁 Wildlife</button>
            <button data-query="bird videos">🦜 Birds</button>
            <button data-query="fish videos">🐟 Fish</button>
            <button data-query="nature videos">🌳 Nature</button>
        </div>
    </section>

    <section class="card">
        <h2>🎮 More Fun</h2>
        <div class="grid">
            <button data-query="cartoons for kids">📺 Cartoons</button>
            <button data-query="soccer highlights">⚽ Soccer</button>
            <button data-query="funny videos">😂 Funny Videos</button>
            <button data-query="satisfying videos">✨ Satisfying Videos</button>
            <button data-query="science experiments for kids">🔬 Science</button>
            <button data-query="LEGO building videos">🧱 LEGO</button>
            <button data-query="car videos">🚗 Cars</button>
            <button data-query="music videos">🎵 Music</button>
            <button data-query="water park videos">💦 Water Parks</button>
            <button data-query="roller coaster POV videos">🎢 Roller Coasters</button>
        </div>
    </section>

    <p><a href="index.html">← Back to TypeFlow</a></p>
</main>

<script>
(() => {
    "use strict";

    const statusText = document.getElementById("status");
    const heardText = document.getElementById("heard");
    const talkButton = document.getElementById("talk");
    const toggleButton = document.getElementById("toggle");
    const stopButton = document.getElementById("stop");
    const searchInput = document.getElementById("searchInput");

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let speaking = true;
    let listening = false;
    let searching = false;
    let finalWords = "";
    let interimWords = "";
    let session = 0;
    let listenTimer = null;
    let navigationTimer = null;
    let autoSearchTimer = null;

    function clearTimers() {
        clearTimeout(listenTimer);
        clearTimeout(navigationTimer);
        clearTimeout(autoSearchTimer);
    }

    function resetTalk() {
        listening = false;
        talkButton.disabled = false;
        talkButton.textContent = "🎤 Talk";
    }

    function cancelRecognition() {
        session++;
        clearTimers();
        listening = false;
        finalWords = "";
        interimWords = "";

        if (recognition) {
            try { recognition.abort(); } catch (error) {}
        }
    }

    function searchYouTube(query, announce = false) {
        query = (query || "").trim();

        if (!query) {
            statusText.textContent = "Say or type something to search!";
            return;
        }

        // Every new search replaces any previous pending search.
        searching = true;
        cancelRecognition();
        resetTalk();

        if (window.speechSynthesis) {
            speechSynthesis.cancel();
        }

        statusText.textContent = "Opening YouTube...";
        heardText.textContent = "Search: " + query;

        const url =
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(query);

        // Navigate immediately; don't wait for a spoken announcement.
        if (announce && speaking && window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance("Searching!");
            utterance.lang = "en-US";
            speechSynthesis.speak(utterance);
        }

        window.location.href = url;
    }

    toggleButton.addEventListener("click", () => {
        speaking = !speaking;

        if (window.speechSynthesis) {
            speechSynthesis.cancel();
        }

        toggleButton.textContent = speaking
            ? "🔊 Speaking: ON"
            : "🔇 Speaking: OFF";

        if (speaking && window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance("Speaking on");
            speechSynthesis.speak(utterance);
        }
    });

    stopButton.addEventListener("click", () => {
        cancelRecognition();
        searching = false;

        if (window.speechSynthesis) {
            speechSynthesis.cancel();
        }

        resetTalk();
        statusText.textContent = "Stopped.";
        heardText.textContent = "";
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
        event.preventDefault();
        searchYouTube(searchInput.value);
    });

    // Clicking a different category immediately uses that category.
    document.querySelectorAll("[data-query]").forEach(button => {
        button.addEventListener("click", () => {
            searchYouTube(button.dataset.query);
        });
    });

    if (!SpeechRecognition) {
        talkButton.addEventListener("click", () => {
            statusText.textContent =
                "Voice search isn't supported in this browser. Type your search instead.";
            searchInput.focus();
        });
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        listening = true;
        searching = false;
        finalWords = "";
        interimWords = "";

        talkButton.disabled = false;
        talkButton.textContent = "🎤 Listening...";
        statusText.textContent = "Listening! Say what you want to watch.";
        heardText.textContent = "";

        const thisSession = session;

        // Fallback only. Final speech results trigger search sooner.
        listenTimer = setTimeout(() => {
            if (!listening || thisSession !== session) return;

            const words = (finalWords || interimWords).trim();

            if (words) {
                searchYouTube(words);
            } else {
                try { recognition.stop(); } catch (error) {}
                resetTalk();
                statusText.textContent =
                    "Didn't catch that. Tap Talk and try again.";
            }
        }, 5000);
    };

    recognition.onresult = event => {
        if (!listening || searching) return;

        let interim = "";
        let final = "";

        for (let i = 0; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript.trim();

            if (!transcript) continue;

            if (result.isFinal) {
                final += transcript + " ";
            } else {
                interim += transcript + " ";
            }
        }

        if (final.trim()) {
            finalWords = final.trim();
        }

        if (interim.trim()) {
            interimWords = interim.trim();
        }

        const words = (finalWords || interimWords).trim();

        if (!words) return;

        heardText.textContent = "I heard: " + words;
        statusText.textContent = "Recognizing your search...";

        // KEY FIX: immediately search when the browser gives a final result.
        const latestResult = event.results[event.results.length - 1];

        if (latestResult && latestResult.isFinal) {
            clearTimeout(listenTimer);
            clearTimeout(autoSearchTimer);

            const query = finalWords || words;
            searchYouTube(query);
        } else {
            // If only interim results arrive, search shortly after speech pauses.
            clearTimeout(autoSearchTimer);
            const thisSession = session;

            autoSearchTimer = setTimeout(() => {
                if (!listening || searching || thisSession !== session) return;

                const query = (finalWords || interimWords).trim();

                if (query) {
                    searchYouTube(query);
                }
            }, 900);
        }
    };

    recognition.onerror = event => {
        if (searching) return;

        clearTimers();
        resetTalk();

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            statusText.textContent =
                "Microphone access is blocked. Allow microphone access in your browser settings.";
        } else if (event.error === "no-speech") {
            statusText.textContent = "No speech detected. Tap Talk and try again.";
        } else if (event.error !== "aborted") {
            statusText.textContent =
                "Voice search had a problem. Try again or type your search.";
        }
    };

    recognition.onend = () => {
        if (searching) return;

        const query = (finalWords || interimWords).trim();

        if (listening && query) {
            searchYouTube(query);
            return;
        }

        resetTalk();
    };

    talkButton.addEventListener("click", () => {
        if (listening) {
            const query = (finalWords || interimWords).trim();

            if (query) {
                searchYouTube(query);
            } else {
                clearTimers();
                try { recognition.stop(); } catch (error) {}
                resetTalk();
                statusText.textContent = "Stopped listening.";
            }

            return;
        }

        cancelRecognition();
        searching = false;

        if (window.speechSynthesis) {
            speechSynthesis.cancel();
        }

        const thisSession = session;

        try {
            recognition.start();
        } catch (error) {
            statusText.textContent =
                "Couldn't start the microphone. Wait a moment and try again.";
            resetTalk();
        }
    });
})();
</script>
</body>
</html>
