<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoBuddy</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
    text-align: center;
}

main {
    max-width: 500px;
    margin: auto;
}

h1 { color: #8db5ff; }

button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: none;
    border-radius: 12px;
    background: #8db5ff;
    color: #101522;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

button:hover, button:focus-visible {
    background: #c4d8ff;
    outline: 3px solid white;
}

#status {
    min-height: 45px;
    font-size: 17px;
}

a { color: #8db5ff; }
</style>
</head>

<body>
<main>
    <h1>🎬 VideoBuddy</h1>
    <p>Hover over buttons to hear them!</p>

    <button id="talk" data-say="Talk">🎤 Talk</button>

    <button id="toggle" data-say="Speaking on or off">
        🔊 Speaking: ON
    </button>

    <button id="stop" data-say="Stop speaking and listening">
        ⏹ Stop
    </button>

    <p id="status" aria-live="polite">Ready!</p>

    <h2>Choose a video</h2>

    <button data-query="funny animal videos" data-say="Animals">
        🐶 Animals
    </button>

    <button data-query="cake baking videos" data-say="Cakes">
        🎂 Cakes
    </button>

    <button data-query="airplane videos" data-say="Airplanes">
        ✈️ Airplanes
    </button>

    <button data-query="cartoons for kids" data-say="Cartoons">
        📺 Cartoons
    </button>

    <button data-query="soccer highlights" data-say="Soccer">
        ⚽ Soccer
    </button>

    <button data-query="train videos" data-say="Trains">
        🚆 Trains
    </button>

    <button data-query="theme park rides" data-say="Theme parks">
        🎢 Theme Parks
    </button>

    <p><a href="index.html" data-say="Back to TypeFlow">← Back to TypeFlow</a></p>
</main>

<script>
const statusText = document.getElementById("status");
const talkButton = document.getElementById("talk");
const toggleButton = document.getElementById("toggle");

let speaking = true;
let recognition = null;
let listening = false;
let hoverTimer = null;
let hoveredItem = null;

function say(text) {
    if (!speaking || !("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(text);
    message.lang = "en-US";
    message.rate = 1;

    speechSynthesis.speak(message);
}

// Hover to hear SHORT labels.
document.addEventListener("mouseover", event => {
    const item = event.target.closest("[data-say]");

    if (!item || !speaking || item === hoveredItem) return;

    hoveredItem = item;
    clearTimeout(hoverTimer);

    hoverTimer = setTimeout(() => {
        if (speaking) say(item.dataset.say);
    }, 350);
});

document.addEventListener("mouseout", event => {
    const item = event.target.closest("[data-say]");

    if (item && !item.contains(event.relatedTarget)) {
        hoveredItem = null;
        clearTimeout(hoverTimer);
    }
});

// Turn all speaking on or off.
toggleButton.addEventListener("click", () => {
    speaking = !speaking;
    speechSynthesis.cancel();

    toggleButton.textContent = speaking
        ? "🔊 Speaking: ON"
        : "🔇 Speaking: OFF";

    if (speaking) say("On");
});

// Stop speaking and listening.
document.getElementById("stop").addEventListener("click", () => {
    speechSynthesis.cancel();

    if (recognition && listening) {
        recognition.abort();
    }

    listening = false;
    talkButton.textContent = "🎤 Talk";
    statusText.textContent = "Stopped.";
});

// Video buttons open YouTube.
function searchYouTube(query) {
    listening = false;
    speechSynthesis.cancel();
    statusText.textContent = "Searching!";

    if (speaking) say("Searching!");

    // Navigate in the same tab to avoid popup blockers.
    setTimeout(() => {
        window.location.href =
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(query);
    }, speaking ? 500 : 0);
}

document.querySelectorAll("[data-query]").forEach(button => {
    button.addEventListener("click", () => {
        searchYouTube(button.dataset.query);
    });
});

// Voice search.
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        listening = true;
        talkButton.textContent = "🎤 Listening...";
        statusText.textContent = "Listening...";
        say("Go ahead!");
    };

    recognition.onresult = event => {
        const words = event.results[0][0].transcript.trim();

        listening = false;
        talkButton.textContent = "🎤 Talk";
        searchYouTube(words);
    };

    recognition.onerror = event => {
        listening = false;
        talkButton.textContent = "🎤 Talk";

        let message = "Try again!";

        if (event.error === "not-allowed") {
            message = "Allow microphone access!";
        } else if (event.error === "no-speech") {
            message = "I didn't hear you. Try again!";
        } else if (event.error === "network") {
            message = "Voice search unavailable!";
        }

        statusText.textContent = message;
        say(message);
    };

    recognition.onend = () => {
        listening = false;
        talkButton.textContent = "🎤 Talk";
    };

    talkButton.addEventListener("click", () => {
        if (listening) {
            recognition.stop();
            return;
        }

        try {
            speechSynthesis.cancel();
            recognition.start();
        } catch (error) {
            statusText.textContent = "Try again!";
            say("Try again!");
        }
    });

} else {
    talkButton.addEventListener("click", () => {
        statusText.textContent = "Voice search isn't supported here.";
        say("Voice search unavailable!");
    });
}
</script>
</body>
</html>
